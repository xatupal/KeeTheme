name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install KeePass (for the KeePass.exe assembly reference)
        shell: pwsh
        run: |
          $keepassDir = "C:\Program Files\KeePass Password Safe 2"
          $keePassExe = Join-Path $keepassDir "KeePass.exe"
          if (-not (Test-Path $keePassExe)) {
            $zip = "$env:TEMP\KeePass.zip"
            $urls = @(
              "https://sourceforge.net/projects/keepass/files/KeePass%202.x/2.42.1/KeePass-2.42.1.zip/download",
              "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/2.42.1/KeePass-2.42.1.zip",
              "https://netix.dl.sourceforge.net/project/keepass/KeePass%202.x/2.42.1/KeePass-2.42.1.zip"
            )
            $downloaded = $false
            foreach ($url in $urls) {
              Write-Host "Downloading KeePass 2.42.1 from $url"
              & curl.exe -L -sS --retry 3 -o $zip -w "http=%{http_code} size=%{size_download}`n" $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and (Get-Item $zip).Length -gt 1000000) {
                $downloaded = $true
                break
              }
            }
            if (-not $downloaded) {
              throw "Failed to download KeePass 2.42.1 package"
            }
            New-Item -ItemType Directory -Force $keepassDir | Out-Null
            Expand-Archive -LiteralPath $zip -DestinationPath $keepassDir -Force
          }
          if (Test-Path $keePassExe) {
            Write-Host "KeePass.exe installed at $keepassDir"
          } else {
            throw "Failed to install KeePass.exe"
          }

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Install .NET Framework 3.5 reference assemblies
        shell: pwsh
        timeout-minutes: 10
        run: |
          $refDir = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\v3.5"
          if (-not (Test-Path (Join-Path $refDir "System.dll"))) {
            $pkgDir = "$env:TEMP\ref35pkg"
            Write-Host "Downloading Microsoft.NETFramework.ReferenceAssemblies.net35 via nuget..."
            & nuget install Microsoft.NETFramework.ReferenceAssemblies.net35 -Version 1.0.3 -OutputDirectory $pkgDir -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "nuget install failed (exit $LASTEXITCODE)" }
            $src = Join-Path $pkgDir "Microsoft.NETFramework.ReferenceAssemblies.net35.1.0.3\build\.NETFramework\v3.5"
            if (-not (Test-Path (Join-Path $src "System.dll"))) {
              $listing = (Get-ChildItem -Recurse $pkgDir -Filter *.dll -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName) -join "`n"
              throw "v3.5 reference assemblies not found under $src; found:`n$listing"
            }
            Write-Host "Copying reference assemblies to $refDir"
            New-Item -ItemType Directory -Force $refDir | Out-Null
            Get-ChildItem -LiteralPath $src | Copy-Item -Destination $refDir -Recurse -Force
          }
          if (-not (Test-Path (Join-Path $refDir "System.dll"))) {
            throw "Failed to install .NET 3.5 reference assemblies at $refDir"
          }
          Write-Host ".NET 3.5 reference assemblies installed at $refDir"

      - name: Create post-build copy destination
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "KeePass\Plugins"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Write-Host "Created $dest"

      - name: Build KeeTheme.dll
        shell: cmd
        run: msbuild KeeTheme.sln /p:Configuration=Release /p:LangVersion=3 /m /fl "/flp:logfile=msbuild.log;verbosity=normal"

      - name: Upload MSBuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log

      - name: Package KeeTheme.plgx
        shell: pwsh
        continue-on-error: true
        run: |
          $plgxDir = Join-Path $env:GITHUB_WORKSPACE "build\PlgX"
          New-Item -ItemType Directory -Force $plgxDir | Out-Null
          robocopy "KeeTheme" $plgxDir /E /XD bin obj .git .vs .idea /XF *.pdb *.suo *.user KeeTheme.dll KeeTheme.plgx build.cmd plgxexclude.txt /NFL /NDL /NJH /NJS /NC /NS | Out-Null
          & "C:\Program Files\KeePass Password Safe 2\KeePass.exe" /plgx-create $plgxDir --debug --plgx-prereq-net:3.5
          Move-Item -LiteralPath "PlgX.plgx" -Destination "KeeTheme.plgx" -Force
          Remove-Item -Recurse -Force $plgxDir
          Write-Host "Created KeeTheme.plgx"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeeTheme
          path: |
            KeeTheme/bin/Release/KeeTheme.dll
            KeeTheme.plgx
