name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install KeePass (for the KeePass.exe assembly reference)
        shell: pwsh
        run: |
          $keepassDir = "C:\Program Files\KeePass Password Safe 2"
          if (-not (Test-Path (Join-Path $keepassDir "KeePass.exe"))) {
            $url = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/2.42.1/KeePass-2.42.1-Portable.zip"
            Write-Host "Downloading KeePass 2.42.1 portable..."
            Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\KeePass.zip" -MaximumRedirection 20
            New-Item -ItemType Directory -Force $keepassDir | Out-Null
            Expand-Archive -LiteralPath "$env:TEMP\KeePass.zip" -DestinationPath $keepassDir -Force
          }
          if (Test-Path (Join-Path $keepassDir "KeePass.exe")) {
            Write-Host "KeePass.exe installed at $keepassDir"
          } else {
            throw "Failed to install KeePass.exe"
          }

      - name: Ensure .NET Framework 3.5 reference assemblies
        shell: pwsh
        continue-on-error: true
        run: |
          $ref = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\v3.5"
          if (-not (Test-Path $ref)) {
            dism.exe /online /enable-feature /featurename:NetFx3 /NoRestart /All
          } else {
            Write-Host ".NET 3.5 reference assemblies already present"
          }

      - name: Create post-build copy destination
        shell: pwsh
        run: |
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "KeePass\Plugins"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Write-Host "Created $dest"

      - name: Build KeeTheme.dll
        shell: cmd
        run: msbuild KeeTheme.sln /p:Configuration=Release /p:LangVersion=3 /m

      - name: Package KeeTheme.plgx
        shell: pwsh
        continue-on-error: true
        run: |
          $plgxDir = Join-Path $env:GITHUB_WORKSPACE "build\PlgX"
          New-Item -ItemType Directory -Force $plgxDir | Out-Null
          robocopy "KeeTheme" $plgxDir /E /XD bin obj .git .vs .idea /XF *.pdb *.suo *.user KeeTheme.dll KeeTheme.plgx build.cmd plgxexclude.txt /NFL /NDL /NJH /NJS /NC /NS | Out-Null
          & "C:\Program Files\KeePass Password Safe 2\KeePass.exe" /plgx-create $plgxDir --debug --plgx-prereq-net:3.5
          Move-Item -LiteralPath "PlgX.plgx" -Destination "KeeTheme.plgx" -Force
          Remove-Item -Recurse -Force $plgxDir
          Write-Host "Created KeeTheme.plgx"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeeTheme
          path: |
            KeeTheme/bin/Release/KeeTheme.dll
            KeeTheme.plgx
